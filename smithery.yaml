# Smithery configuration for DivLens MCP
# https://smithery.ai/docs/config
# This tells Smithery how to run DivLens as a local stdio MCP server.

startCommand:
  type: stdio
  configSchema:
    # DivLens requires no configuration — zero API keys, zero environment variables.
    type: object
    properties: {}
    required: []
  commandFunction:
    # Returns the exact command to launch the MCP server on the user's machine.
    |-
    (config) => ({
      command: "divlens-core",
      args: ["--mcp"],
      env: {}
    })
