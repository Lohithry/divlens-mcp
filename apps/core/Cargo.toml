[package]
name        = "divlens-core"
version     = "0.1.0"
edition     = "2024"
description = "DivLens MCP — Real-time system intelligence for AI agents"
license     = "Apache-2.0"
repository  = "https://github.com/Lohithry/divlens-mcp"
keywords    = ["mcp", "diagnostics", "ai", "system", "monitoring"]
categories  = ["command-line-utilities", "os"]

# ─────────────────────────────────────────────────────────────────────────────
# Feature flags
# ─────────────────────────────────────────────────────────────────────────────

[features]
default = []
# Enable vector-memory (LanceDB + fastembed) — disabled by default to keep
# the binary small and avoid ONNX model downloads for users who don't need it.
vector-memory = ["dep:fastembed", "dep:lancedb", "dep:arrow-array", "dep:arrow-schema"]

# ─────────────────────────────────────────────────────────────────────────────
# Core dependencies
# ─────────────────────────────────────────────────────────────────────────────

[dependencies]
anyhow          = "1.0.100"
async-trait     = "0.1.77"
battery         = "0.7.8"
chrono          = { version = "0.4", features = ["serde"] }
clap            = { version = "4.5.53", features = ["derive"] }
dirs            = "5.0"
directories     = "5.0"
dotenvy         = "0.15"
futures         = "0.3.31"
get_if_addrs    = "0.5.3"
jwalk           = "0.8.1"
netstat2        = "0.11.2"
once_cell       = "1.19"
rayon           = "1.10.0"
regex           = "1.12.2"
rusqlite        = { version = "0.37.0", features = ["bundled"] }
serde           = { version = "1.0.228", features = ["derive"] }
serde_json      = "1.0.145"
sysinfo         = "0.37.2"
thiserror       = "1.0"
tokio           = { version = "1.48.0", features = ["full"] }
tracing         = "0.1.43"
tracing-subscriber = "0.3.22"
wait-timeout    = "0.2"
walkdir         = "2.5"
wmi             = "0.18.0"

# Optional — enabled by the `vector-memory` feature
arrow-array  = { version = "56.2.0", optional = true }
arrow-schema = { version = "56.2.0", optional = true }
fastembed    = { version = "5.4.0",  optional = true }
lancedb      = { version = "0.22.3", optional = true }

# ─────────────────────────────────────────────────────────────────────────────
# Platform-specific dependencies
# ─────────────────────────────────────────────────────────────────────────────

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_EventLog",
    "Win32_System_Ioctl",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_UI_Shell",
    "Win32_System_Diagnostics",
    "Win32_System_Diagnostics_Debug",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation     = "0.10"
core-foundation-sys = "0.8"
io-kit-sys          = "0.4"
mach2               = "0.4"
